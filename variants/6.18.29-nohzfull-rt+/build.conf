# Variant: 6.18.29-nohzfull-rt+
# Branch-tip build against rpi-6.18.y, tracking the kernel line the
# Raspberry Pi distro is currently shipping as 6.18.29+rpt-rpi-v8. The
# first ./build.sh run will write the resolved SHA back into KERNEL_REF
# below for reproducibility.

KERNEL_REMOTE=https://github.com/raspberrypi/linux.git
KERNEL_BRANCH=rpi-6.18.y

# Empty = use branch tip; build.sh writes the resolved SHA back here.
KERNEL_REF=

SCMVERSION_SUFFIX=+
KDEB_PKGVERSION=1.0-1
